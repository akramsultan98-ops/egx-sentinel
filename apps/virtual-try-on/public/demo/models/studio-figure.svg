      <stop offset="1" stop-color="#bdb4a6"/>
    </linearGradient>
    <linearGradient id="topG" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2f3238"/>
      <stop offset="1" stop-color="#20232a"/>
    </linearGradient>
    <linearGradient id="botG" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3b3f46"/>
      <stop offset="1" stop-color="#282b31"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1200" fill="url(#backdrop)"/>
  <ellipse cx="400" cy="1118" rx="230" ry="46" fill="url(#floor)"/>

