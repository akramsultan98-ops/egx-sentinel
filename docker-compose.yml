services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-egx_sentinel}
      POSTGRES_USER: ${POSTGRES_USER:-egx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # The schema is applied by the migration runner
    # (`python -m egx_engine.db.migrate`), not by an init-time mount: an
    # entrypoint script only ever runs on an empty volume, so it cannot carry a
    # database forward across schema changes.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5433:5432"

volumes:
  postgres_data:
